- name: Basic Linux system setup
  hosts: all
  become: yes

  vars:
    timezone: Asia/Bangkok

  tasks:
    - name: Set timezone
      timezone:
        name: "{{ timezone }}"

    - name: Gather service facts
      service_facts:

    - name: Prefer chrony when it is installed and not masked
      set_fact:
        time_sync_service: "{{ 'chrony' if ('chrony.service' in ansible_facts.services and ansible_facts.services['chrony.service'].status != 'masked') else 'systemd-timesyncd' }}"

    - name: Install systemd-timesyncd when chrony is not in use
      apt:
        name: systemd-timesyncd
        state: present
      when: time_sync_service == 'systemd-timesyncd'

    - name: Ensure time sync is enabled
      systemd:
        name: "{{ time_sync_service }}"
        state: started
        enabled: yes
        masked: no

    - name: Set system locale to UTF-8 (optional)
      locale_gen:
        name: en_US.UTF-8
        state: present

    - name: Set system-wide locale (optional)
      lineinfile:
        path: /etc/default/locale
        regexp: '^LANG='
        line: 'LANG=en_US.UTF-8'

    - name: Remove unsupported journald Timestamp setting
      lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^Timestamp='
        state: absent
      notify: Restart Journald

    - name: Install unattended-upgrades
      apt:
        name: unattended-upgrades
        state: present

    - name: Enable unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

  handlers:
    - name: Restart Journald
      systemd:
        name: systemd-journald
        state: restarted
